name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The SDK pinned in global.json builds and brings the runtime the tests run on.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Build installers and portable packages
        shell: pwsh
        run: ./scripts/Publish-HADA.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            artifacts/installer/**/*.msi
            artifacts/installer/**/*.zip
          if-no-files-found: error

  # Everything but the WPF tray app is meant to run on Linux and macOS too. The tests run there, those of
  # Windows' own sensors and actions skipped, and the Avalonia window is built there.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # On Linux the tests have an X server and a D-Bus to talk to, as a desktop session has: those of the active
      # window, of pressed keys and of media players run against the real thing.
      - name: Prepare the desktop
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xvfb libxtst6 dbus

      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dotnet test tests/HADA.Tests -c Release
          else
            dotnet test tests/HADA.Tests -c Release
          fi

      # The window drawn with Avalonia, which is to run on these systems too.
      - name: Build the window
        run: dotnet build src/HADA.App -c Release

      # The service itself, as Linux and macOS run it: a process of the user, started, left running, and stopped. Its
      # sensors read the runner for real; nothing may fail.
      - name: Run the service
        shell: bash
        run: |
          root="$RUNNER_TEMP/hada"
          dotnet publish src/HADA.Service -c Release -o "$root/service" --nologo -v quiet
          touch "$root/HADA.portable"
          "$root/service/HADA.Service" &
          pid=$!
          sleep 20
          kill -0 "$pid"
          kill -TERM "$pid"
          wait "$pid"
          log="$root/data/logs/service.log"
          cat "$log"
          grep -q "Application started" "$log"
          if grep -F -e "[ERR]" -e "[CRT]" "$log"; then exit 1; fi

  # The Linux packages, built on Linux: an AppImage, a .deb and an .rpm for x64 and arm64. Nobody has tried them on
  # Linux by hand yet, and their names say so. The x64 .deb is installed here and HADA started from it, as at
  # sign-in, with nobody looking: the app must start the service and be heard by it.
  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install the packaging tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq rpm xvfb dbus-x11
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sha256sum "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Build the packages
        run: APPIMAGETOOL="$RUNNER_TEMP/appimagetool" scripts/package-linux.sh artifacts/linux

      - name: Check the packages
        run: |
          cd artifacts/linux
          dpkg-deb --info HADA-*-linux-x64-untested.deb
          rpm -qip HADA-*-linux-arm64-untested.rpm
          ./HADA-*-linux-x64-untested.AppImage --appimage-extract > /dev/null
          test -x squashfs-root/AppRun -a -x squashfs-root/opt/hada/app/HADA.App -a -x squashfs-root/opt/hada/service/HADA.Service
          rm -rf squashfs-root

      # Started in the background, as at sign-in: no window may open, so only the agent talks to the service.
      # Asked to end as at signing out, it takes the service with it.
      - name: Install the .deb and start HADA from it
        timeout-minutes: 5
        run: |
          sudo apt-get install -yq ./artifacts/linux/HADA-*-linux-x64-untested.deb
          test "$(readlink -f "$(command -v hada)")" = /opt/hada/app/HADA.App
          # Its output to a file: a process left running must not keep the step waiting for it.
          dbus-run-session -- xvfb-run -a /opt/hada/app/HADA.App --background > "$RUNNER_TEMP/hada-output.log" 2>&1 &
          sleep 25
          logs="$HOME/.local/state/hada/logs"
          cat "$logs/app.log" "$logs/service.log"
          pgrep -f /opt/hada/service/HADA.Service
          grep -q "Started the service" "$logs/app.log"
          grep -q "Connected to the service" "$logs/app.log"
          if grep -F "client 'ui:" "$logs/service.log"; then echo "The window opened in the background."; exit 1; fi
          if grep -F -e "[ERR]" -e "[CRT]" "$logs/app.log" "$logs/service.log"; then exit 1; fi
          pkill -TERM -f /opt/hada/app/HADA.App
          for second in $(seq 1 20); do pgrep -f /opt/hada/ > /dev/null || break; sleep 1; done
          cat "$RUNNER_TEMP/hada-output.log"
          if pgrep -fa /opt/hada/; then echo "HADA did not end."; pkill -KILL -f /opt/hada/; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: artifacts/linux/*
          if-no-files-found: error

  # The Mac's disk images, built on a Mac: HADA.app for Apple silicon and for Intel. Nobody has tried them on a Mac by
  # hand yet, and their names say so. The Apple silicon app is taken out of its image, as a user drags it out, and
  # started as at sign-in, with nobody looking: it must start the service and be heard by it.
  macos-packages:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build the packages
        run: scripts/package-macos.sh artifacts/macos

      - name: Take HADA out of its image and start it
        timeout-minutes: 5
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/image" artifacts/macos/HADA-*-macos-arm64-untested.dmg
          test -L "$RUNNER_TEMP/image/Applications"
          app="$RUNNER_TEMP/HADA.app"
          cp -R "$RUNNER_TEMP/image/HADA.app" "$app"
          hdiutil detach "$RUNNER_TEMP/image"
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/HADA.App" -a -x "$app/Contents/MacOS/service/HADA.Service"
          # Its output to a file: a process left running must not keep the step waiting for it.
          "$app/Contents/MacOS/HADA.App" --background > "$RUNNER_TEMP/hada-output.log" 2>&1 &
          sleep 25
          logs="$HOME/Library/Logs/HADA"
          cat "$logs/app.log" "$logs/service.log"
          pgrep -f "$app/Contents/MacOS/service/HADA.Service"
          grep -q "Started the service" "$logs/app.log"
          grep -q "Connected to the service" "$logs/app.log"
          if grep -F "client 'ui:" "$logs/service.log"; then echo "The window opened in the background."; exit 1; fi
          if grep -F -e "[ERR]" -e "[CRT]" "$logs/app.log" "$logs/service.log"; then exit 1; fi
          pkill -TERM -f "$app/Contents/MacOS/HADA.App"
          for second in $(seq 1 20); do pgrep -f "$app/" > /dev/null || break; sleep 1; done
          cat "$RUNNER_TEMP/hada-output.log"
          if pgrep -fl "$app/"; then echo "HADA did not end."; pkill -KILL -f "$app/"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: artifacts/macos/*.dmg
          if-no-files-found: error
