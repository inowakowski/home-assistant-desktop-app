name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The SDK pinned in global.json builds and brings the runtime the tests run on.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Build installers and portable packages
        shell: pwsh
        run: ./scripts/Publish-HADA.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            artifacts/installer/**/*.msi
            artifacts/installer/**/*.zip
          if-no-files-found: error
