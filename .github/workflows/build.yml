name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The SDK pinned in global.json builds and brings the runtime the tests run on.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Build installers and portable packages
        shell: pwsh
        run: ./scripts/Publish-HADA.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            artifacts/installer/**/*.msi
            artifacts/installer/**/*.zip
          if-no-files-found: error

  # Everything but the WPF tray app is meant to run on Linux and macOS too. The tests run there, those of
  # Windows' own sensors and actions skipped, and the Avalonia window is built there.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test tests/HADA.Tests -c Release

      # The window drawn with Avalonia, which is to run on these systems too.
      - name: Build the window
        run: dotnet build src/HADA.App -c Release

      # The service itself, as Linux runs it: a process of the user, started, left running, and stopped. Nobody is
      # signed in on the runner, so the sensors of the session say so; nothing may fail.
      - name: Run the service
        if: runner.os == 'Linux'
        shell: bash
        run: |
          root="$RUNNER_TEMP/hada"
          dotnet publish src/HADA.Service -c Release -o "$root/service" --nologo -v quiet
          touch "$root/HADA.portable"
          "$root/service/HADA.Service" &
          pid=$!
          sleep 20
          kill -0 "$pid"
          kill -TERM "$pid"
          wait "$pid"
          log="$root/data/logs/service.log"
          cat "$log"
          grep -q "Application started" "$log"
          if grep -F -e "[ERR]" -e "[CRT]" "$log"; then exit 1; fi
