name: Documentation

# Every change to the documentation is built, so a broken link or page is caught at once.
# The site is published to GitHub Pages only when this workflow is started by hand ("Run workflow"),
# which needs Pages to be enabled for the repository with "GitHub Actions" as its source.
on:
  push:
    branches: [main]
    paths: ["docs/**", "website/**", "mkdocs.yml", "scripts/build_site.py", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "website/**", "mkdocs.yml", "scripts/build_site.py", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Build
        run: mkdocs build --strict

      # The website Cloudflare Pages publishes: the landing page with the documentation under docs/.
      - name: Build the website
        run: python scripts/build_site.py

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          path: site

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
