# The documentation site. Pages are the Markdown files in docs/; build with "mkdocs build", preview with "mkdocs serve".
site_name: HADA
site_description: Home Assistant Desktop App – connects a Windows computer to Home Assistant.
# DOCS_SITE_URL is the address the documentation is published at; Cloudflare Pages sets it.
site_url: !ENV [DOCS_SITE_URL, "https://inowakowski.github.io/home-assistant-desktop-app/"]
repo_url: https://github.com/inowakowski/home-assistant-desktop-app
repo_name: inowakowski/home-assistant-desktop-app
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Ignacy Nowakowski. MIT license.
exclude_docs: requirements.txt

theme:
  name: material
  logo: assets/img/logo.png
  favicon: assets/img/logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.edit

# A translation of a page sits next to it with the language in its name: index.md, index.pl.md.
# A page without a translation shows in English. To add a language, add it here and translate the pages.
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: pl
          name: Polski
          build: true
          site_description: Home Assistant Desktop App – łączy komputer z Windows z Home Assistant.
          nav_translations:
            Home: Start
            Getting started: Pierwsze kroki
            Installation: Instalacja
            Portable version: Wersja przenośna
            First setup: Pierwsza konfiguracja
            Updating: Aktualizacja
            What it does: Co potrafi
            Sensors: Czujniki
            Controls: Sterowanie
            Notifications: Powiadomienia
            Custom sensors, buttons, quick actions: Własne czujniki, przyciski, szybkie akcje
            Several users on one computer: Kilku użytkowników na jednym komputerze
            The HADA window: Okno HADA
            MQTT engine: Silnik MQTT
            WebSocket engine: Silnik WebSocket
            Automation examples: Przykłady automatyzacji
            Reference: Informacje
            Configuration: Konfiguracja
            Logs: Logi
            Security: Bezpieczeństwo
            Known limitations: Znane ograniczenia
            Troubleshooting: Rozwiązywanie problemów
            Development: Dla programistów
            Architecture: Architektura
            Building and running: Budowanie i uruchamianie
            Adding entities in code: Dodawanie encji w kodzie
            Changelog: Historia zmian

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Portable version: getting-started/portable.md
      - First setup: getting-started/first-setup.md
      - Updating: getting-started/updating.md
  - What it does:
      - Sensors: features/sensors.md
      - Controls: features/controls.md
      - Notifications: features/notifications.md
      - Custom sensors, buttons, quick actions: features/custom-entities.md
      - Several users on one computer: features/several-users.md
      - The HADA window: window.md
  - Home Assistant:
      - MQTT engine: home-assistant/mqtt.md
      - WebSocket engine: home-assistant/websocket.md
      - Automation examples: home-assistant/examples.md
  - Reference:
      - Configuration: reference/configuration.md
      - Logs: reference/logs.md
      - Security: reference/security.md
      - Known limitations: reference/limitations.md
      - Troubleshooting: reference/troubleshooting.md
      - FAQ: faq.md
  - Development:
      - Architecture: development/architecture.md
      - Building and running: development/building.md
      - Adding entities in code: development/adding-entities.md
  - Changelog: changelog.md
